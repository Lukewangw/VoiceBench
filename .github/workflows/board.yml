# Runs the board: applies the rules to every issue/comment event, then republishes the site with a
# fresh snapshot of all issues. Code changes are tested first and only published if the tests pass.
# Bot actions use GITHUB_TOKEN, which never re-triggers this workflow.
name: Board

on:
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Safety net: republish every six hours in case an event was missed.
  schedule:
    - cron: '17 */6 * * *'

permissions: {}

jobs:
  test:
    name: Test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Pinned: Playwright's browser dependencies are known for this release.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Keep screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/.output
          if-no-files-found: ignore

  triage:
    name: Apply board rules
    if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    # Runs for one issue go one at a time, and a newer event replaces a run still waiting. Each run
    # works through all of that issue's pending commands, so a replaced run loses nothing.
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Find the newest tested commit
        id: tested
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            // A push (or a manual run) brings its own commit, and this job only runs once its tests
            // pass. Issue, comment and scheduled runs use the newest commit pushed to main whose Test
            // job passed, so untested code (a pull request's branch, say) never runs here.
            if (['push', 'workflow_dispatch'].includes(context.eventName)) return core.setOutput('sha', context.sha)
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'board.yml',
              branch: 'main',
              event: 'push',
              per_page: 30,
            })
            for (const run of data.workflow_runs) {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id: run.id })
              if (jobs.jobs.some((job) => job.name === 'Test' && job.conclusion === 'success'))
                return core.setOutput('sha', run.head_sha)
            }
            core.setFailed('None of the last 30 pushes to main passed its tests, so nothing ran.')
      - uses: actions/checkout@v7
        if: steps.tested.outputs.sha != ''
        with:
          ref: ${{ steps.tested.outputs.sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        if: steps.tested.outputs.sha != ''
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require('node:url')
            const file = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.js`)
            const { default: triage } = await import(file.href)
            await triage({ github, context, core })

  publish:
    name: Publish the board
    needs: [test, triage]
    # Not for pull requests or their comments, and never with failing tests. Runs when triage was
    # skipped (pushes, schedule) or failed, so the site stays current.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !(github.event_name == 'issue_comment' && github.event.issue.pull_request) && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
      pages: write
      id-token: write
    # One deploy at a time; a newer event replaces any deploy still waiting, and the snapshot is taken
    # inside this job, so the site never goes back to older data.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is on
        id: pages
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            let site = null
            try {
              site = (await github.rest.repos.getPages(context.repo)).data
            } catch (error) {
              if (error.status !== 404) throw error
            }
            const on = site?.build_type === 'workflow'
            if (!on) core.warning('The board was not published: set Settings → Pages → Source to "GitHub Actions", then run this workflow again.')
            core.setOutput('on', String(on))
      - name: Find the newest tested commit
        id: tested
        if: steps.pages.outputs.on == 'true'
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            // A push (or a manual run) brings its own commit, and this job only runs once its tests
            // pass. Issue, comment and scheduled runs use the newest commit pushed to main whose Test
            // job passed, so untested code (a pull request's branch, say) never runs here.
            if (['push', 'workflow_dispatch'].includes(context.eventName)) return core.setOutput('sha', context.sha)
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'board.yml',
              branch: 'main',
              event: 'push',
              per_page: 30,
            })
            for (const run of data.workflow_runs) {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id: run.id })
              if (jobs.jobs.some((job) => job.name === 'Test' && job.conclusion === 'success'))
                return core.setOutput('sha', run.head_sha)
            }
            core.setFailed('None of the last 30 pushes to main passed its tests, so nothing ran.')
      - uses: actions/checkout@v7
        if: steps.tested.outputs.sha != ''
        with:
          ref: ${{ steps.tested.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.tested.outputs.sha != ''
        with:
          node-version: 24
          cache: npm
      - if: steps.tested.outputs.sha != ''
        run: npm ci
      - name: Build
        if: steps.tested.outputs.sha != ''
        run: npm run build
        env:
          VITE_REPO: ${{ github.repository }}
      - name: Snapshot issues
        if: steps.tested.outputs.sha != ''
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require('node:url')
            const file = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/snapshot.js`)
            const { default: snapshot } = await import(file.href)
            await snapshot({ github, context, core, outFile: 'dist/data.json' })
      - uses: actions/configure-pages@v6
        if: steps.tested.outputs.sha != ''
      - uses: actions/upload-pages-artifact@v5
        if: steps.tested.outputs.sha != ''
        with:
          path: dist
      - id: deployment
        if: steps.tested.outputs.sha != ''
        uses: actions/deploy-pages@v5
